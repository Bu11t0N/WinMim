name: Validate
on:
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build tools
        run: python -m pip install -r requirements-dev.txt
      - name: Prepare native components, build and run Core tests
        shell: pwsh
        run: ./tools/build.ps1 -PrepareNative
      - name: Verify tool behavior
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Verify native binaries
        run: python tools/verify_native.py
