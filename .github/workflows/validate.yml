name: Validate
on:
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build tools
        run: python -m pip install -r requirements-dev.txt
      - name: Prepare native components, build and run Core tests
        shell: pwsh
        run: ./tools/build.ps1 -PrepareNative
      - name: Verify tool behavior
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Verify native binaries
        run: python tools/verify_native.py
      - name: Build WinMim Preview MSI
        shell: pwsh
        run: |
          $wixRoot = Join-Path $env:RUNNER_TEMP 'winmim-wix'
          New-Item -ItemType Directory -Path $wixRoot -Force | Out-Null
          $wix = Join-Path $wixRoot 'wix.exe'
          Push-Location $wixRoot
          try {
            dotnet tool install wix --version 6.0.2 --tool-path $wixRoot --source https://api.nuget.org/v3/index.json
            if ($LASTEXITCODE -ne 0) { throw 'WiX installation failed' }
            & $wix extension add WixToolset.UI.wixext/6.0.2
            if ($LASTEXITCODE -ne 0) { throw 'WiX UI extension installation failed' }
          }
          finally { Pop-Location }
          $ui = Join-Path $wixRoot '.wix/extensions/WixToolset.UI.wixext/6.0.2/wixext6/WixToolset.UI.wixext.dll'
          ./tools/build-installer.ps1 -Wix $wix -UiExtension $ui
      - name: Upload WinMim Preview MSI
        uses: actions/upload-artifact@v4
        with:
          name: WinMim-Preview-x64
          path: build/installer/*.msi
          if-no-files-found: error
